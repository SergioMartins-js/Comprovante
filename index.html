<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Captura de Foto</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f4f4;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
.container{background:#fff;padding:20px;border-radius:10px;max-width:700px;width:95%;box-shadow:0 2px 10px rgba(0,0,0,.2)}
video,img{width:100%;border:1px solid #ccc;border-radius:8px}
button{width:100%;padding:12px;margin-top:10px;font-size:16px;cursor:pointer}
#preview{display:none;margin-top:10px}
</style>
</head>
<body>
<div class="container">
<h2>Captura de Foto</h2>
<video id="video" autoplay playsinline></video>
<canvas id="canvas" style="display:none"></canvas>
<img id="preview" alt="Prévia">
<button id="iniciar">Iniciar câmera</button>
<button id="capturar">Capturar e Enviar</button>
</div>
<script>
const APPS_SCRIPT_URL='https://script.google.com/macros/s/AKfycbx9dXsl3d2aaWTwFB-CHlcx6kjlXiUOzX2latNTI-GXkWjZ3PxHMdEqXuCSH2C2Jpcw/exec';
const video=document.getElementById('video');
const canvas=document.getElementById('canvas');
const preview=document.getElementById('preview');
let stream=null;
async function iniciarCamera(){
 stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});
 video.srcObject=stream;
}
async function enviarFoto(base64) {

  try {

    const resposta = await fetch(
      APPS_SCRIPT_URL,
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          imagem: base64
        })
      }
    );

    const resultado = await resposta.json();

    if (resultado.sucesso) {

      alert(
        "Foto salva com sucesso!\n\n" +
        resultado.url
      );

    } else {

      alert(
        "Erro: " +
        resultado.erro
      );

    }

  } catch (erro) {

    console.error(erro);

    alert(
      "Falha ao enviar foto: " +
      erro.message
    );

  }

}
 document.getElementById('iniciar').onclick=async()=>{try{await iniciarCamera();}catch(e){alert(e.message)}};
 document.getElementById('capturar').onclick=async()=>{
 if(!stream){await iniciarCamera();}
 canvas.width=video.videoWidth;
 canvas.height=video.videoHeight;
 canvas.getContext('2d').drawImage(video,0,0);
 const foto=canvas.toDataURL('image/png');
 preview.src=foto;preview.style.display='block';
 await enviarFoto(foto);
 };
</script>
</body>
</html>
